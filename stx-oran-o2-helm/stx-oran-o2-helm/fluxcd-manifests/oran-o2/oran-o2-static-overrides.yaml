# Ensure pods run on platform cores
podLabels:
  app.starlingx.io/component: platform

# ImagePullSecrets for operator ServiceAccount, list of secrets in the same
# namespace used to pull operator image. Must be set for any cluster configured
# with private docker registry.
imagePullSecrets:
  - default-registry-key

# For o2service, use the mirror image on docker.io instead of the original:
# nexus3.o-ran-sc.org:10004/o-ran-sc/pti-o2imsdms:2.3.0
o2ims:
  serviceaccountname: admin-oran-o2
  images:
    tags:
      o2service: docker.io/oranscinf/pti-o2imsdms:2.3.0
      postgres: docker.io/library/postgres:18
      redis: docker.io/valkey/valkey:8.0-alpine
    pullPolicy: IfNotPresent
  logginglevel: "INFO"
  useHostCert: true
