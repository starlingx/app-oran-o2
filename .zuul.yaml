---
- project:
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-oran-o2-tox-py39
        - k8sapp-oran-o2-tox-pylint
        - k8sapp-oran-o2-tox-flake8
        - k8sapp-oran-o2-tox-metadata
        - k8sapp-oran-o2-tox-coverage:
            voting: false
        - k8sapp-oran-o2-tox-bandit:
            voting: false
        - k8sapp-oran-o2-tox-py313:
            voting: false
        - k8sapp-oran-o2-tox-pylint-trixie:
            voting: false
        - k8sapp-oran-o2-tox-flake8-trixie:
            voting: false
        - k8sapp-oran-o2-tox-metadata-trixie:
            voting: false
        - k8sapp-oran-o2-tox-coverage-trixie:
            voting: false
        - k8sapp-oran-o2-tox-bandit-trixie:
            voting: false
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-oran-o2-tox-py39
        - k8sapp-oran-o2-tox-pylint
        - k8sapp-oran-o2-tox-flake8
        - k8sapp-oran-o2-tox-metadata
    post:
      jobs:
        - stx-app-oran-o2-upload-git-mirror

- job:
    name: k8sapp-oran-o2-tox-py39
    parent: tox-py39
    description: |
      Run py39 test for k8sapp-oran-o2
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-oran-o2/*
    vars:
      tox_envlist: py39
      python_version: 3.9
      tox_extra_args: -c python3-k8sapp-oran-o2/k8sapp_oran_o2/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-oran-o2-tox-metadata
    parent: tox
    description: |
      Run metadata test for k8sapp-oran-o2
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-oran-o2/k8sapp_oran_o2/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-oran-o2-tox-pylint
    parent: tox
